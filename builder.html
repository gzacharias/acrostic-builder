<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="gists.css">
<link rel="stylesheet" href="utils.css">
<link rel="stylesheet" href="builder.css">
<title>Acrostic Builder</title>
</head>
<body>

<label id="username-display" style="display:none"></label>
<h1>Acrostic Builder</h1>

<div class="panel">

  <div class="subview" style="Flex-direction: row; align-items: baseline">
    <label>File Name:</label>
    <div id="puzzle-name" contenteditable="true" class="editable"></div>
  </div>

  <div class="subview">
    <label>Quotation<span id="quote-count"></span></label>
    <div id="quotation" contenteditable="true" class="editable" placeholder="Enter quotation…"></div>
  </div>

  <div class="subview">
    <label>Title/Author<span id="source-count"></span></label>
    <div id="source" contenteditable="true" class="editable" placeholder="Enter source of quotation…"></div>
  </div>

  <div class="subview" id="letters-subview">
    <label>Available Letters<span id="letters-count"></span></label>
    <div id="letters"></div>
  </div>

  <div class="subview" style="position: relative">
  <div style="display:flex; justify-content:space-between; align-items:baseline">
    <label id="words-label"></label>
    <label id="avg-length"></label>
  </div>
    <div id="words-container" placeholder="Words entries will appear here once Title/Author is entered"></div>
    <div id="thinking-overlay" style="display:none"></div>
  </div>

</div>

<div class="buttons">
  <button id="clue-btn" title="Switch to writing clues for the answers (enabled when puzzle is complete)" disabled>Add Clues</button>
  <button id="restart-btn" title="Start a new puzzle">Restart</button>
  <button id="save-btn" title="Save this puzzle to a file" disabled>Save</button>
  <button id="load-btn" title="Load a previously saved puzzle from a file">Load</button>
  <button id="quit-btn">Quit</button>
</div>

<script src="gists.js"></script>
<script src="utils.js"></script>
<script src="builder.js"></script>

</body>
</html>
